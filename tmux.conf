# Only the project's separate tmux server reads this file.
set -g default-terminal tmux-256color
set -as terminal-features ',xterm-kitty:RGB:usstyle:sync'
set -g allow-passthrough on
set -g status off
set -g pane-border-status off
# Keep native cell boundaries; draw sub-cell section rules in the instruments.
set -g pane-border-format ''
set -g pane-border-lines single
set -g pane-border-style 'fg=#374448,bg=#05080d'
set -g pane-active-border-style 'fg=#374448,bg=#05080d'
set -g window-style 'bg=#05080d,fg=#aacfd1'
set -g window-active-style 'bg=#05080d,fg=#aacfd1'
set -g mouse on
set -g escape-time 10
# Prefix-z is ordinary tmux zoom. Prefix-d detaches; no global user bindings.
