# Experimental static dotted background; use kitty.conf for the solid surface.
include kitty.conf
# Distinguish native default cells from the shell's explicit upstream surface.
# The tile covers this clear color; shell cells stay opaque #05080d.
background #000000
background_opacity 1
# background.py supplies an absolute image path with Kitty's -o override.
background_image_layout tiled
background_image_linear no
background_tint 0
background_tint_gaps 0
